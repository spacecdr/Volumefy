name: Firmware
on:
  push:
    paths: ['src/**', 'platformio.ini', '.github/workflows/firmware.yml']
  pull_request:
    paths: ['src/**', 'platformio.ini', '.github/workflows/firmware.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install platformio==6.1.19
      - run: pio run -e esp32-c3-devkitm-1
