<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
<title id="title">Collegamenti funzionali Volumefy BLE e IR</title><desc id="desc">Encoder CLK a GPIO2, DT a GPIO3, SW a GPIO4, positivo a 3,3 V, massa comune. GPIO5 comanda lo stadio IR, GPIO8 è il LED integrato attivo basso. Non è un pinout fisico.</desc>
<rect width="1100" height="620" rx="24" fill="#101922"/>
<g font-family="sans-serif" fill="#eef3f4"><text x="45" y="55" font-size="27" font-weight="bold">Un ingresso fisico. Due modi di controllare.</text><text x="45" y="87" font-size="16" fill="#b1c0c9">Schema funzionale · le posizioni non riproducono i pin delle schede</text>
<rect x="45" y="135" width="220" height="320" rx="18" fill="#23313c"/><rect x="420" y="135" width="260" height="320" rx="18" fill="#23313c"/><rect x="810" y="280" width="240" height="145" rx="18" fill="#23313c"/>
<text x="65" y="175" font-size="24">KY-040</text><text x="440" y="173" font-size="24">ESP32-C3</text><text x="440" y="201" font-size="17" fill="#b1c0c9">SuperMini</text>
<g font-size="18"><text x="195" y="241">CLK</text><text x="195" y="283">DT</text><text x="195" y="325">SW</text><text x="195" y="367">+</text><text x="195" y="409">GND</text><text x="440" y="241">GPIO 2</text><text x="440" y="283">GPIO 3</text><text x="440" y="325">GPIO 4</text><text x="440" y="367">3,3 V</text><text x="440" y="409">GND</text><text x="599" y="310">GPIO 5</text></g>
<circle cx="116" cy="308" r="44" fill="#152029" stroke="#506778" stroke-width="3"/><path d="M116 273v20" stroke="#d4f677" stroke-width="5" stroke-linecap="round"/>
<text x="830" y="316" font-size="20">Pilotaggio + LED IR</text><text x="830" y="348" font-size="15" fill="#b1c0c9">oppure modulo IR</text><text x="830" y="377" font-size="15" fill="#b1c0c9">Segnale logico a 3,3 V</text><text x="710" y="299" font-size="15" fill="#d4f677">Comando</text><text x="717" y="444" font-size="15" fill="#b1c0c9">Massa comune</text>
<rect x="810" y="142" width="240" height="90" rx="16" fill="#1c2928" stroke="#53614b"/><text x="833" y="176" font-size="19" fill="#d4f677">BLE HID → host</text><text x="833" y="207" font-size="15" fill="#b1c0c9">Alternativo alla modalità IR</text>
<text x="45" y="508" font-size="17" fill="#b1c0c9">LED integrato: GPIO8, attivo LOW · USB-C: alimentazione e programmazione</text><text x="45" y="543" font-size="17" fill="#b1c0c9">LED IR nudo: transistor/MOSFET + resistenza da dimensionare. Non pilotarlo in potenza dal GPIO.</text><text x="45" y="578" font-size="17" fill="#b1c0c9">GPIO2 è un pin di strapping: verificare l'avvio. Alimentazione e pull-up encoder a 3,3 V.</text>
</g><g fill="none" stroke-width="4"><path d="M265 235H420" stroke="#d4f677"/><path d="M265 277H420" stroke="#66d9ce"/><path d="M265 319H420" stroke="#c1a0ff"/><path d="M265 361H420" stroke="#ff927e"/><path d="M265 403H420M680 403H810" stroke="#a8bac5"/><path d="M680 320H810" stroke="#d4f677"/><path d="M680 185H810" stroke="#66d9ce" stroke-dasharray="7 6"/></g></svg>
